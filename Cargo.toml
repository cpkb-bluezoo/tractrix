[package]
name = "tractrix"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Non-blocking XML push parser and serializer (Gonzalez-style)"
readme = "README.md"
license = "LGPL-2.1-or-later"
authors = ["Chris Burdess <dog@gnu.org>"]
repository = "https://github.com/cpkb-bluezoo/tractrix"
homepage = "https://github.com/cpkb-bluezoo/tractrix"
keywords = ["xml", "parser", "serializer", "streaming", "sax"]
categories = ["encoding", "parser-implementations"]
# Keep the ~15MB W3C suite in git/CI, but out of the crates.io package.
exclude = ["xmlconf/", "benchmarks/"]

[lib]
name = "tractrix"
path = "src/lib.rs"

[dependencies]
bytes = "1"
encoding_rs = "0.8"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[test]]
name = "xmlconf"
path = "tests/conformance/xmlconf.rs"
harness = false
